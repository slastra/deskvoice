# Echo-cancelled mic for deskvoice's wake word. Copy to ~/.config/pipewire/.
#
# Its own small PipeWire process (deskvoice-aec.service), not a module in the
# main daemon: starting, stopping or breaking it never restarts the desktop's
# audio. WebRTC's AEC takes what the default sink plays (monitor mode, so no
# app has to play into a special sink) and subtracts it from the webcam mic,
# so games, videos, music and deskdoc's own voice stop reaching the wake model.
#
# Noise suppression and gain control are off: the wake model learned the mic's
# raw sound, and only the speakers' audio should go.
#
# deskvoice listens with [listen] target = "deskvoice_aec"; nothing else uses
# it (priority.session 0 keeps it from becoming the default mic). Rollback:
# remove that target line, restart deskvoice, stop/disable deskvoice-aec.

context.properties = {
    log.level = 0
    # Flush denormals on the data thread. On some input, WebRTC AEC3's matched
    # filter and biquads run on subnormal floats; each one costs a microcode
    # assist (hundreds of cycles), which took the AEC from ~1% to 55% of a
    # core, with xruns. Restarting doesn't reliably clear it, since the input
    # is the trigger.
    cpu.zero.denormals = true
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        args = { }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            monitor.mode = true
            audio.rate = 48000
            audio.channels = 1
            audio.position = [ MONO ]
            aec.args = {
                webrtc.high_pass_filter = true
                webrtc.noise_suppression = false
                webrtc.gain_control = false
                webrtc.transient_suppression = false
                webrtc.voice_detection = false
            }
            capture.props = {
                node.name = "deskvoice_aec.capture"
                target.object = "YOUR_MIC_NODE_NAME"   # wpctl status / pw-cli ls Node
                node.passive = true
                node.dont-reconnect = false
            }
            # name every node: the module's generic defaults ("echo-cancel-sink")
            # are hard to tell apart in pw-top when diagnosing
            sink.props = {
                node.name = "deskvoice_aec.sink"
            }
            source.props = {
                node.name = "deskvoice_aec"
                node.description = "Webcam mic, echo cancelled (deskvoice)"
                priority.session = 0
                priority.driver = 0
            }
        }
    }
]
